[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finance_stuff"
version = "0.1.0"
description = "Python tools for analysis of Brazilian financial markets"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "yfinance",
]
